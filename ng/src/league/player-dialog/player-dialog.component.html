<div class="modal-header">
  <h4 class="modal-title" id="modal-basic-title">{{ editing ? 'Spielerdaten ändern' : 'Spieler:in nachmelden' }}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
</div>
<div class="modal-body mb-3">
  <league-player-select [control]="selectedPlayer" [preferredZps]="params.preferredZps"></league-player-select>
  @for (error of (errors?.validationErrors?.['lastName'] || errors?.validationErrors?.['firstName']); track error.message) {
    <div class="small text-danger">{{ error.message }}</div>
  }

  <nsv-form [form]="form" [columns]="2" [validationErrors]="errors?.validationErrors" (keyup.enter)="saveDialog()"></nsv-form>
  <nsv-form [form]="registrationForm" [validationErrors]="errors?.validationErrors" (keyup.enter)="saveDialog()"></nsv-form>
</div>
<nsv-dialog-footer [dialog]="this"></nsv-dialog-footer>
